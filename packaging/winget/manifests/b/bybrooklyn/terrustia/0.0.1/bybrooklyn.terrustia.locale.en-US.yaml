ShortDescription: An async Terraria 1.4.5.8 dedicated server, written from scratch in Rust
Description: |-
  terrustia is a from-scratch, clean-room reimplementation of the Terraria 1.4.5.8 dedicated
  server, transcribed from a legally-obtained decompiled reference rather than derived from
  Re-Logic's own source. It speaks the real protocol (release 326) to a real Terraria client,
  reads and writes real .wld world files, and is built to point at a world you already own and
  serve it — not to grow trees for you. Not affiliated with Re-Logic.
