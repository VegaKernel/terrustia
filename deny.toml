# cargo-deny policy.
#
# Without a config, `cargo deny check licenses` falls back to an empty allow-list and rejects
# every dependency — including plain MIT — which reads like a licence problem and is not one.
#
# Re-audited when this failed a pre-tag check: 203 unique external crates (up from an earlier
# "59, zero copyleft" note here that went stale once `ureq`/`igd-next` — the update-check and
# UPnP dependencies — pulled in `rustls`/`ring`/`webpki-roots`/`attohttpc`). One of the three
# licenses that addition needed, MPL-2.0, is real, file-level copyleft — but MPL-2.0 was written
# specifically to be usable as-is inside a GPL-family work (Mozilla's own "Secondary Licenses"
# compatibility clause), which is exactly this project's own situation (AGPL server/client, MIT
# proto crate), so allowing it here is a deliberate, informed choice, not an oversight. ISC and
# CDLA-Permissive-2.0 (the latter is `webpki-roots`' license for its own root-certificate *data*,
# not code) are both plain permissive, the same tier as MIT/BSD-3-Clause already below.
#
#   cargo deny check

[licenses]
# Everything the dependency graph actually uses. Deliberately a list rather than a category, so a
# new dependency arriving under something unexpected fails rather than being waved through.
allow = [
    # Ours: the server and client are AGPL, `terrustia-proto` is MIT.
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "ISC",
    "CDLA-Permissive-2.0",
    # File-level copyleft, deliberately allowed — see this file's own top comment for why it is
    # safe alongside an AGPL workspace crate specifically.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Two majors of the same crate is usually a transitive disagreement rather than a mistake, so it
# is worth seeing without being fatal. `syn`, `winnow` and `rand_core` are currently doubled.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates refer to each other by path, which is not the kind of wildcard this
# check is for — that is an unpinned *registry* dependency.
allow-wildcard-paths = true

[advisories]
# A known vulnerability or an unmaintained crate should stop a release, not produce a note nobody
# reads. `cargo audit` currently reports neither.
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
