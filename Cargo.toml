[workspace]
members = ["crates/terrustia-proto", "crates/terrustia-client", "crates/terrustia"]
resolver = "3"

[workspace.package]
# 0.0.1 deliberately, not 0.1.0. World generation is visibly unfinished and the first release
# should not imply otherwise by its number.
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"

# Warnings are errors everywhere, so CI does not have to remember to check and a warning cannot
# accumulate quietly into a hundred. `unsafe_code` is warned rather than forbidden here because
# one crate legitimately needs it — `game/clock.rs` reads the thread's CPU clock — and the two
# crates that do not need it forbid it outright at their own roots.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "warn"

[workspace.lints.clippy]
# Deliberately not `pedantic`: this codebase transcribes a game, and several of pedantic's rules
# would push it away from the shape the original has, which is the one thing worth preserving.
all = { level = "deny", priority = -1 }

[workspace.dependencies]
bytes = "1.12"
# zlib-rs is about 1.6x faster than the miniz_oxide backend at encoding a tile section
# (~0.155 ms vs ~0.248 ms) for output 1.3% larger, which is the right trade for a packet that
# every joining player pays for fifteen times over.
# Only for the thread clock: a tick has to be timed by the CPU it actually used, because wall
# clock also counts the moments the OS gave the core to something else.
libc = "0.2"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# Only SmallRng is used, and always seeded explicitly, so the OS entropy and ChaCha
# generators are not needed.
rand = { version = "0.9", default-features = false, features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "net",
    "macros",
    "sync",
    "time",
    "signal",
    "io-util",
    # The server console reads stdin, which is the only place this is needed.
    "io-std",
] }
tokio-util = { version = "0.7", features = ["codec"] }
# Config is read; the admin store is also written, which is what `display` is for.
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "display"] }
# The one place where writing it myself would be worse than taking a dependency: password hashing.
# Everything else in this workspace is hand-rolled on purpose; a KDF is not the exception to make.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
tracing = "0.1"
# `Targets` gives the same `terrustia=debug` filtering as `env-filter` without pulling in
# a regex engine.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
# Raw mode and key decoding for the sticky console prompt. Line editing, history and completion
# are hand-rolled on top of it — this crate is used only for what a terminal genuinely cannot be
# driven without: entering/leaving raw mode portably and turning bytes into key events.
#
# "windows" is not an optional extra here despite the name: it gates crossterm's own `dep:winapi`/
# `dep:crossterm_winapi`, which its `cfg(windows)` source files need to compile *at all* on that
# platform. Missing until this project's first real Windows CI run — untestable from a macOS/Linux
# session, and there was no CI running against a real repository until now.
crossterm = { version = "0.28", default-features = false, features = ["events", "windows"] }
# The web admin panel's HTTP/WebSocket surface. `ws` is the only extra needed — no macros
# (routes are built by hand, matching this workspace's own preference for explicit code over
# derive-heavy convenience), no multipart, no http2 (a localhost admin panel has no use for it).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
# Embeds the built frontend (crates/terrustia/web-panel/dist) into the binary. `embed-web` is a
# real cargo feature, on by default: disabling it serves straight from disk instead, for iterating
# on the frontend without a full `cargo build`. See `panel/mod.rs`'s doc comment for the pattern,
# referenced from `../alchemist`'s own `src/server/mod.rs`.
rust-embed = { version = "8", features = ["axum"] }

[profile.dev]
opt-level = 1

# World generation and tile-section deflate are hot even in debug builds; keeping
# dependencies optimised makes a debug server usable against a real client.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
