[package]
name = "terrustia"
# The server. Distributed as binaries and a container, not as a crate — and marking it keeps an accidental `cargo publish` from putting the AGPL server on crates.io.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "An async Terraria server"

[dependencies]
terrustia-proto = { path = "../terrustia-proto" }

bytes.workspace = true
libc.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
argon2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossterm.workspace = true
axum.workspace = true
rust-embed.workspace = true
ureq.workspace = true
tempfile.workspace = true

[dev-dependencies]
terrustia-client = { path = "../terrustia-client" }

[features]
default = ["embed-web"]
# Embed the built frontend into the binary. Disabled, `panel/mod.rs` serves straight from
# `web-panel/dist/` on disk instead — for iterating on the frontend without a full rebuild.
embed-web = []

[lints]
workspace = true
