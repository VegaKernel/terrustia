name: Temporary framed spawn test repair

on:
  push:
    branches:
      - chatgpt/frame-important-spawn-tests

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/frame-important-spawn-tests
      - name: Replace invalid frame-important test constructors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("crates/terrustia/src/game/bound_spawn.rs"): [
                  ("Tile::block(19)", "Tile::framed(19, 0, 0)"),
              ],
              Path("crates/terrustia/src/game/spawn_clearance.rs"): [
                  ("Tile::block(block)", "Tile::framed(block, 0, 0)"),
              ],
              Path("crates/terrustia/src/game/spawn_source.rs"): [
                  ("Tile::block(19)", "Tile::framed(19, 0, 0)"),
                  ("Tile::block(floor)", "Tile::framed(floor, 0, 0)"),
                  ("Tile::block(380)", "Tile::framed(380, 0, 0)"),
                  ("Tile::block(239)", "Tile::framed(239, 0, 0)"),
                  ("Tile::block(belt)", "Tile::framed(belt, 0, 0)"),
                  ("Tile::block(CONVEYOR_LEFT)", "Tile::framed(CONVEYOR_LEFT, 0, 0)"),
                  ("Tile::block(CONVEYOR_RIGHT)", "Tile::framed(CONVEYOR_RIGHT, 0, 0)"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              changed = False
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                      changed = True
              assert changed, f"no expected constructor replacements in {path}"
              path.write_text(text)

          known_bad = [
              "Tile::block(19)",
              "Tile::block(239)",
              "Tile::block(380)",
              "Tile::block(CONVEYOR_LEFT)",
              "Tile::block(CONVEYOR_RIGHT)",
          ]
          for path in replacements:
              text = path.read_text()
              for needle in known_bad:
                  assert needle not in text, f"remaining invalid constructor {needle} in {path}"
          PY
      - name: Check formatting and whitespace
        run: |
          cargo fmt --all --check
          git diff --check
      - name: Run full workspace tests
        run: cargo test --workspace
      - name: Commit test repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/terrustia/src/game/bound_spawn.rs crates/terrustia/src/game/spawn_clearance.rs crates/terrustia/src/game/spawn_source.rs
          git diff --cached --check
          git commit -m "test: construct framed spawn tiles correctly"
          git push origin HEAD:chatgpt/frame-important-spawn-tests
