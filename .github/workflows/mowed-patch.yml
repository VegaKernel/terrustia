name: Temporary mowed spawn patch

on:
  push:
    branches:
      - chatgpt/mowed-grass-spawn-gate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mowed-grass-spawn-gate
      - name: Apply exact runtime wiring
        shell: python
        run: |
          from pathlib import Path

          server_path = Path("crates/terrustia/src/game/server.rs")
          server = server_path.read_text()
          old = """            eclipse: self.world.eclipse,
            downed_plantera: progress.downed_plantera,
"""
          new = """            eclipse: self.world.eclipse,
            slime_rain: self.slime_rain.is_active(),
            invasion: self.invasion.is_some(),
            downed_plantera: progress.downed_plantera,
"""
          assert server.count(old) == 1, "server EventSpawns constructor shape changed"
          server_path.write_text(server.replace(old, new, 1))

          spawn_path = Path("crates/terrustia/src/game/spawn.rs")
          spawn = spawn_path.read_text()

          old = """    pub eclipse: bool,
    pub downed_plantera: bool,
"""
          new = """    pub eclipse: bool,
    pub slime_rain: bool,
    pub invasion: bool,
    pub downed_plantera: bool,
"""
          assert spawn.count(old) == 1, "EventSpawns field shape changed"
          spawn = spawn.replace(old, new, 1)

          old = """            let y = ground - 1;

            let Some(medium) = crate::game::spawn_medium::classify(world, x, ground) else {
"""
          new = """            let y = ground - 1;
            let source = crate::game::spawn_source::resolve(world, x, ground);
            let mowed_events = crate::game::spawn_postcheck::MowedGrassEvents {
                blood_moon: world.blood_moon,
                eclipse: world.eclipse,
                pumpkin_moon: world.pumpkin_moon,
                frost_moon: world.snow_moon,
                slime_rain: events.slime_rain,
                invasion: events.invasion,
            };
            if crate::game::spawn_postcheck::mowed_grass_rejects(source.block, mowed_events, || {
                rng.random_range(0..10) == 0
            }) {
                break;
            }

            let Some(medium) = crate::game::spawn_medium::classify(world, x, ground) else {
"""
          assert spawn.count(old) == 1, "accepted-floor wiring shape changed"
          spawn = spawn.replace(old, new, 1)

          old = """                let spawning_block = crate::game::spawn_source::block(world, x, ground);
                let water_pool = crate::game::water_spawn::pool(
                    depth,
                    biome,
                    world.progress.hard_mode,
                    spawning_block,
                );
"""
          new = """                let water_pool = crate::game::water_spawn::pool(
                    depth,
                    biome,
                    world.progress.hard_mode,
                    source.block,
                );
"""
          assert spawn.count(old) == 1, "water source wiring shape changed"
          spawn = spawn.replace(old, new, 1)

          old = """            eclipse: false,
            downed_plantera: false,
"""
          new = """            eclipse: false,
            slime_rain: false,
            invasion: false,
            downed_plantera: false,
"""
          assert spawn.count(old) == 1, "quiet EventSpawns fixture shape changed"
          spawn_path.write_text(spawn.replace(old, new, 1))
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/terrustia/src/game/server.rs crates/terrustia/src/game/spawn.rs
          git diff --cached --check
          git commit -m "fix: wire mowed-grass spawn state"
          git push origin HEAD:chatgpt/mowed-grass-spawn-gate
