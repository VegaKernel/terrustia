name: Temporary mowed spawn patch

on:
  push:
    branches:
      - chatgpt/mowed-grass-spawn-gate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mowed-grass-spawn-gate
      - name: Apply exact runtime wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server_path = Path("crates/terrustia/src/game/server.rs")
          server = server_path.read_text()
          old = "            eclipse: self.world.eclipse,\n            downed_plantera: progress.downed_plantera,\n"
          new = "            eclipse: self.world.eclipse,\n            slime_rain: self.slime_rain.is_active(),\n            invasion: self.invasion.is_some(),\n            downed_plantera: progress.downed_plantera,\n"
          assert server.count(old) == 1, "server EventSpawns constructor shape changed"
          server_path.write_text(server.replace(old, new, 1))

          spawn_path = Path("crates/terrustia/src/game/spawn.rs")
          spawn = spawn_path.read_text()

          old = "    pub eclipse: bool,\n    pub downed_plantera: bool,\n"
          new = "    pub eclipse: bool,\n    pub slime_rain: bool,\n    pub invasion: bool,\n    pub downed_plantera: bool,\n"
          assert spawn.count(old) == 1, "EventSpawns field shape changed"
          spawn = spawn.replace(old, new, 1)

          old = "            let y = ground - 1;\n\n            let Some(medium) = crate::game::spawn_medium::classify(world, x, ground) else {\n"
          new = "            let y = ground - 1;\n            let source = crate::game::spawn_source::resolve(world, x, ground);\n            let mowed_events = crate::game::spawn_postcheck::MowedGrassEvents {\n                blood_moon: world.blood_moon,\n                eclipse: world.eclipse,\n                pumpkin_moon: world.pumpkin_moon,\n                frost_moon: world.snow_moon,\n                slime_rain: events.slime_rain,\n                invasion: events.invasion,\n            };\n            if crate::game::spawn_postcheck::mowed_grass_rejects(source.block, mowed_events, || {\n                rng.random_range(0..10) == 0\n            }) {\n                break;\n            }\n\n            let Some(medium) = crate::game::spawn_medium::classify(world, x, ground) else {\n"
          assert spawn.count(old) == 1, "accepted-floor wiring shape changed"
          spawn = spawn.replace(old, new, 1)

          old = "                let spawning_block = crate::game::spawn_source::block(world, x, ground);\n                let water_pool = crate::game::water_spawn::pool(\n                    depth,\n                    biome,\n                    world.progress.hard_mode,\n                    spawning_block,\n                );\n"
          new = "                let water_pool = crate::game::water_spawn::pool(\n                    depth,\n                    biome,\n                    world.progress.hard_mode,\n                    source.block,\n                );\n"
          assert spawn.count(old) == 1, "water source wiring shape changed"
          spawn = spawn.replace(old, new, 1)

          old = "            eclipse: false,\n            downed_plantera: false,\n"
          new = "            eclipse: false,\n            slime_rain: false,\n            invasion: false,\n            downed_plantera: false,\n"
          assert spawn.count(old) == 1, "quiet EventSpawns fixture shape changed"
          spawn_path.write_text(spawn.replace(old, new, 1))
          PY
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/terrustia/src/game/server.rs crates/terrustia/src/game/spawn.rs
          git diff --cached --check
          git commit -m "fix: wire mowed-grass spawn state"
          git push origin HEAD:chatgpt/mowed-grass-spawn-gate
