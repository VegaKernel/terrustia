name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Cosign signs with the workflow's own GitHub identity rather than a key, so there is no private
  # key to store, lose or have stolen — and the signature proves the artefact was built *here*.
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # A signed release with an empty embedded panel is a broken deliverable someone might
      # actually enable and find nothing — build the real frontend before Rust compiles.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build the web panel frontend
        working-directory: crates/terrustia/web-panel
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Use rust-lld for musl
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr 'a-z-' 'A-Z_')_LINKER=rust-lld" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p terrustia --target ${{ matrix.target }}

      # Deliberately no terrustia.toml in the archive. It is the *default* config filename, so
      # shipping one would have every install silently pick up settings nobody chose.
      - name: Archive (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          name="terrustia-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/terrustia" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp packaging/terrustia.service "dist/$name/" 2>/dev/null || true
          tar -czf "dist/$name.tar.gz" -C dist "$name"

      - name: Archive (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          name="terrustia-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/terrustia.exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          (cd dist && 7z a "$name.zip" "$name")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.{tar.gz,zip}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: sigstore/cosign-installer@v3

      # Signed from the first tag rather than added later: retro-fitting signatures after people
      # have already installed unsigned builds is far worse than doing it from the start, and
      # `terrustia update` refuses anything it cannot verify.
      - name: Sign
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          for f in *.tar.gz *.zip SHA256SUMS; do
            [ -e "$f" ] || continue
            cosign sign-blob --bundle "$f.cosign.bundle" "$f"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Verify a download before running it:

            ```sh
            cosign verify-blob \
              --bundle terrustia-${{ github.ref_name }}-<target>.tar.gz.cosign.bundle \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              terrustia-${{ github.ref_name }}-<target>.tar.gz
            ```

            See `README.md`'s "What works" section for what's implemented and what isn't. Pointing
            this at a world you already have is the most finished path.
