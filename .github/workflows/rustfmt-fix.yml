name: Temporary rustfmt repair

on:
  push:
    branches:
      - chatgpt/rustfmt-spawn-parity

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rustfmt-spawn-parity
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Verify formatting and whitespace
        run: |
          cargo fmt --all --check
          git diff --check
      - name: Compile Terrustia
        run: cargo check -p terrustia
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git diff --cached --check
          git commit -m "style: format spawn parity modules"
          git push origin HEAD:chatgpt/rustfmt-spawn-parity
