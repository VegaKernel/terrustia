name: Temporary framed spawn unit-test repair

on:
  push:
    branches:
      - chatgpt/frame-important-spawn-tests-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/frame-important-spawn-tests-v2
      - name: Replace invalid frame-important test constructors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("crates/terrustia/src/game/bound_spawn.rs"): [
                  ("Tile::block(19)", "Tile::framed(19, 0, 0)"),
              ],
              Path("crates/terrustia/src/game/spawn_clearance.rs"): [
                  ("Tile::block(block)", "Tile::framed(block, 0, 0)"),
              ],
              Path("crates/terrustia/src/game/spawn_source.rs"): [
                  ("Tile::block(19)", "Tile::framed(19, 0, 0)"),
                  ("Tile::block(floor)", "Tile::framed(floor, 0, 0)"),
                  ("Tile::block(380)", "Tile::framed(380, 0, 0)"),
                  ("Tile::block(239)", "Tile::framed(239, 0, 0)"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              before = text
              for old, new in pairs:
                  text = text.replace(old, new)
              assert text != before, f"no expected constructor replacements in {path}"
              path.write_text(text)

          known_bad = ["Tile::block(19)", "Tile::block(239)", "Tile::block(380)"]
          for path in replacements:
              text = path.read_text()
              for needle in known_bad:
                  assert needle not in text, f"remaining invalid constructor {needle} in {path}"

          source = Path("crates/terrustia/src/game/spawn_source.rs").read_text()
          assert "Tile::block(belt)" in source, "conveyor loop must remain a plain block"
          assert "Tile::block(CONVEYOR_LEFT)" in source, "conveyor scan fixture must remain plain"
          PY
      - name: Check formatting and whitespace
        run: |
          cargo fmt --all --check
          git diff --check
      - name: Run Terrustia library tests
        run: cargo test -p terrustia --lib
      - name: Commit test repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/terrustia/src/game/bound_spawn.rs crates/terrustia/src/game/spawn_clearance.rs crates/terrustia/src/game/spawn_source.rs
          git diff --cached --check
          git commit -m "test: construct framed spawn tiles correctly"
          git push origin HEAD:chatgpt/frame-important-spawn-tests-v2
