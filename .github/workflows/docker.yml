name: Container

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      # Both architectures built natively on the x86 runner, because nothing in the dependency
      # graph needs a C compiler. Compiling aarch64 inside a QEMU-emulated container instead would
      # turn a few minutes into most of an hour, for the same bytes.
      - name: Build both binaries
        run: |
          mkdir -p dist
          for pair in "x86_64-unknown-linux-musl amd64" "aarch64-unknown-linux-musl arm64"; do
            set -- $pair
            export "CARGO_TARGET_$(echo "$1" | tr 'a-z-' 'A-Z_')_LINKER=rust-lld"
            cargo build --release --locked -p terrustia --target "$1"
            cp "target/$1/release/terrustia" "dist/terrustia-linux-$2"
          done

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign "${IMAGE}@${DIGEST}"

      # An image that has never been started is not a working image. This proves the container
      # comes up with no configuration at all, generates a world, and accepts a connection.
      - name: Run it with no configuration
        run: |
          docker run -d --name probe -v terrustia-probe:/data \
            -p 7777:7777 "${IMAGE}:edge" || \
            docker run -d --name probe -v terrustia-probe:/data \
              -p 7777:7777 "$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          for _ in $(seq 1 180); do
            if docker exec probe nc -z 127.0.0.1 7777; then
              echo "the container serves with no configuration"
              docker rm -f probe
              exit 0
            fi
            sleep 1
          done
          echo "the container never started serving:"
          docker logs probe
          exit 1
